{% extends "base.html" %}{% block body %}<section class="formbox"><small>ADMIN PANEL</small><h1>Управление сезонами</h1>{% if not authorized %}<p>Введите секретный ключ администратора.</p><form method="post"><label>Ключ<input name="admin_key" type="password" required></label><button class="btn">Войти</button></form>{% else %}<h2>Создать текущий сезон</h2><form method="post"><input type="hidden" name="action" value="season"><label>Название сезона<input name="season_name" placeholder="Season 1" required></label><button class="btn">Сделать текущим</button></form>{% if seasons %}<h2>Статистика игрока</h2><form method="post"><input type="hidden" name="action" value="player"><label>Сезон<select name="season_id">{% for s in seasons %}<option value="{{s.id}}">{{s.name}}</option>{% endfor %}</select></label><label>Игрок<select name="user_id">{% for u in users %}<option value="{{u.id}}">{{u.game_nick or u.username}}</option>{% endfor %}</select></label><label>Роль<select name="role">{% for r in ['Jungler','Mid Lane','Gold Lane','EXP Lane','Roamer'] %}<option>{{r}}</option>{% endfor %}</select></label><label>MVP<input name="mvp" type="number" min="0" value="0"></label><label>Победы<input name="wins" type="number" min="0" value="0"></label><label>Матчи<input name="matches" type="number" min="0" value="0"></label><button class="btn">Сохранить игрока</button></form><h2>Статистика команды</h2><form method="post"><input type="hidden" name="action" value="team"><label>Сезон<select name="season_id">{% for s in seasons %}<option value="{{s.id}}">{{s.name}}</option>{% endfor %}</select></label><label>Команда<select name="team_id">{% for t in teams %}<option value="{{t.id}}">{{t.name}}</option>{% endfor %}</select></label><label>Победы<input name="wins" type="number" min="0" value="0"></label><label>Матчи<input name="matches" type="number" min="0" value="0"></label><label>Очки<input name="points" type="number" min="0" value="0"></label><button class="btn">Сохранить команду</button></form>{% endif %}{% endif %}</section>{% endblock %}
