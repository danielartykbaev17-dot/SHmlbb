{% extends "base.html" %}{% block body %}<h1>Игровой профиль</h1><p class="muted">Заполни данные, чтобы тебя могли найти.</p><form class="formbox" method="post"><label>Игровой ник<input name="game_nick" value="{{u.game_nick}}"></label><label>Player ID<input name="game_id" value="{{u.game_id}}"></label><label>Zone ID<input name="zone_id" value="{{u.zone_id}}"></label><label>Сервер / регион<input name="server" value="{{u.server}}" placeholder="Europe, SEA..."></label><label>Ранг<select name="rank">{% for x in ['Warrior','Elite','Master','Grandmaster','Epic','Legend','Mythic','Mythical Honor','Mythical Glory','Mythical Immortal'] %}<option {{'selected' if u.rank==x else ''}}>{{x}}</option>{% endfor %}</select></label><label>Роль<select name="role">{% for x in ['Любая','Jungler','Mid Lane','Gold Lane','EXP Lane','Roamer'] %}<option {{'selected' if u.role==x else ''}}>{{x}}</option>{% endfor %}</select></label><label>О себе<textarea name="bio">{{u.bio}}</textarea></label><button class="btn">Сохранить</button></form>{% endblock %}
