{% extends "base.html" %}{% block body %}<section class="formbox"><small>WELCOME TO SHMLBB</small><h1>{{'Создай аккаунт' if register else 'С возвращением'}}</h1><form method="post">{% if register %}<label>Никнейм<input name="username" required minlength="3"></label><label>Email<input name="email" type="email" required></label>{% else %}<label>Никнейм или email<input name="identity" required></label>{% endif %}<label>Пароль<input name="password" type="password" minlength="8" required></label><button class="btn">{{'Зарегистрироваться' if register else 'Войти'}}</button></form><p>{% if register %}Уже есть аккаунт? <a href="/login">Войти</a>{% else %}Нет аккаунта? <a href="/register">Создать</a>{% endif %}</p></section>{% endblock %}
