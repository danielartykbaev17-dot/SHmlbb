{% extends "base.html" %}{% block body %}<h1>Поиск игроков</h1><form class="filters"><input name="q" value="{{q}}" placeholder="Ник игрока"><input name="role" value="{{role}}" placeholder="Роль"><input name="rank" value="{{rank}}" placeholder="Ранг"><input name="server" value="{{server}}" placeholder="Сервер"><button class="btn">Найти</button></form><div class="grid">{% for p in players %}<article><b>{{p.game_nick or p.username}}</b><small>{{p.rank}} · {{p.role}} · {{p.server}} {% if p.game_id %}· ID {{p.game_id}}{% endif %}</small><small>{{p.bio}}</small></article>{% else %}<p class="muted">Игроки не найдены.</p>{% endfor %}</div>{% endblock %}
